# 빌드 과정 없는 정적 사이트. 저장소 루트를 그대로 배포한다.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 관리자 페이지는 검색에 노출하지 않는다 (접근 제어는 firestore.rules)
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
